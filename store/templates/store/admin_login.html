<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #334155
                );

            overflow: hidden;

        }

        /* Decorative circles */

        body::before{

            content: '';

            position: absolute;

            width: 300px;

            height: 300px;

            background: rgba(255,165,0,0.2);

            border-radius: 50%;

            top: -80px;

            left: -80px;

        }

        body::after{

            content: '';

            position: absolute;

            width: 250px;

            height: 250px;

            background: rgba(255,255,255,0.08);

            border-radius: 50%;

            bottom: -60px;

            right: -60px;

        }

        .login-container{

            width: 360px;

            padding: 40px;

            border-radius: 20px;

            background: rgba(255,255,255,0.1);

            backdrop-filter: blur(12px);

            box-shadow: 0 8px 30px rgba(0,0,0,0.3);

            text-align: center;

            position: relative;

            z-index: 1;

        }

        .login-container h1{

            color: white;

            margin-bottom: 30px;

            font-size: 32px;

        }

        .input-box{

            margin-bottom: 20px;

        }

        .input-box input{

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            outline: none;

            font-size: 16px;

        }

        .input-box input:focus{

            border: 2px solid orange;

        }

        button{

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: orange;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;

        }

        button:hover{

            background: darkorange;

            transform: scale(1.02);

        }

    </style>

</head>

<body>

    <div class="login-container">

        <h1>Admin Login</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

            </div>

            <div class="input-box">

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

            </div>

            <button type="submit">

                Login

            </button>

        </form>

    </div>

</body>

</html>
