<!DOCTYPE html>
<html>

<head>

    <title>Manage Orders</title>

    <style>

        body{
            font-family: Arial;
            padding: 20px;
            background: #f4f4f4;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td{
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th{
            background: orange;
            color: white;
        }

        h1{
            margin-bottom: 20px;
        }

        button{
            padding: 6px 10px;
            margin: 2px;
            border: none;
            cursor: pointer;
            color: white;
            border-radius: 4px;
        }

        .view-btn{
            background: blue;
        }

        .edit-btn{
            background: green;
        }

        .payment-btn{
            background: purple;
        }

        .delete-btn{
            background: red;
        }

        #details-box{
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 5px;
            display: none;
        }

        input{
            padding: 8px;
            margin: 5px;
            width: 250px;
        }

    </style>

</head>

<body>

<h1>Orders List</h1>

<table>

    <thead>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Payable</th>
            <th>Payment Method</th>
            <th>Actions</th>

        </tr>

    </thead>

    <tbody id="orders-table">

    </tbody>

</table>

<!-- DETAILS BOX -->

<div id="details-box">

    <h2>Order Details</h2>

    <input type="hidden" id="order-id">

    <div>
        <input type="text" id="name" placeholder="Name">
    </div>

    <div>
        <input type="email" id="email" placeholder="Email">
    </div>

    <div>
        <input type="number" id="payable" placeholder="Payable">
    </div>

    <div>
        <input type="text" id="payment_method" placeholder="Payment Method">
    </div>

    <button class="edit-btn" onclick="updateOrder()">
        Save Changes
    </button>

</div>

<script>

loadOrders();


// =======================
// LOAD ALL ORDERS
// =======================

function loadOrders(){

    fetch('/api/orders/')

    .then(response => response.json())

    .then(data => {

        let table = document.getElementById('orders-table');

        table.innerHTML = '';

        data.forEach(order => {

            table.innerHTML += `

            <tr>

                <td>${order.id}</td>
                <td>${order.name}</td>
                <td>${order.email}</td>
                <td>${order.payable}</td>
                <td>${order.payment_method}</td>

                <td>

                    <button 
                        class="view-btn"
                        onclick="viewOrder(${order.id})">
                        View
                    </button>

                    <button 
                        class="edit-btn"
                        onclick="editOrder(${order.id})">
                        Edit
                    </button>


                    <button 
                        class="delete-btn"
                        onclick="deleteOrder(${order.id})">
                        Delete
                    </button>

                </td>

            </tr>

            `;

        });

    });

}



// =======================
// VIEW ORDER
// =======================

function viewOrder(id){

    fetch(`/api/orders/${id}/`)

    .then(response => response.json())

    .then(order => {

        document.getElementById('details-box').style.display = 'block';

        document.getElementById('order-id').value = order.id;
        document.getElementById('name').value = order.name;
        document.getElementById('email').value = order.email;
        document.getElementById('payable').value = order.payable;
        document.getElementById('payment_method').value = order.payment_method;

    });

}



// =======================
// EDIT ORDER
// =======================

function editOrder(id){

    viewOrder(id);

}



// =======================
// UPDATE ORDER
// =======================

function updateOrder(){

    let id = document.getElementById('order-id').value;

    let data = {

        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        payable: document.getElementById('payable').value,
        payment_method: document.getElementById('payment_method').value

    };

    fetch(`/api/orders/update/${id}/`, {

        method: 'PUT',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify(data)

    })

    .then(response => response.json())

    .then(data => {

        alert('Order Updated Successfully');

        loadOrders();

    });

}







// =======================
// DELETE ORDER
// =======================

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {

        const cookies = document.cookie.split(';');

        for (let i = 0; i < cookies.length; i++) {

            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + '=')) {

                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));

                break;

            }

        }

    }

    return cookieValue;
}



function deleteOrder(id){

    let confirmDelete = confirm("Are you sure you want to delete this order?");

    if(confirmDelete){

        fetch(`/api/orders/delete/${id}/`, {

            method: 'DELETE',

            headers: {

                'Content-Type': 'application/json',

                'X-CSRFToken': getCookie('csrftoken')

            }

        })

        .then(response => response.json())

        .then(data => {

            alert(data.message);

            loadOrders();

        })

        .catch(error => {

            console.log(error);

            alert("Delete Failed");

        });

    }

}
</script>

</body>

</html>
